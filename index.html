<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#3b82f6"/>
<title>DompetKu</title>
<link rel="manifest" href="./manifest.json"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#f8fafc; --card:#ffffff; --border:#e5e7eb; --text:#0f172a; --muted:#64748b; }
  .dark { --bg:#0b1220; --card:#111a2e; --border:#1f2a44; --text:#e2e8f0; --muted:#94a3b8; }
  body { background:var(--bg); color:var(--text); font-family: system-ui; }
  .card { background:var(--card); border:1px solid var(--border); }
  .muted { color:var(--muted); }
  .chip { display:inline-flex; padding:.125rem .5rem; border-radius:9999px; font-size:.7rem; font-weight:600 }
  .chip-inc { background:#d1fae5; color:#065f46 }
  .chip-exp { background:#fee2e2; color:#991b1b }
  .chip-sav { background:#e0e7ff; color:#3730a3 }
  input,select { background:var(--card); color:var(--text); border:1px solid var(--border); font-size:16px; }
  input:focus,select:focus { outline:none; border-color:#3b82f6; }
  .modal-bg { background:rgba(0,0,0,.5); }
  .progress { height:.5rem; background:#e2e8f0; border-radius:9999px; overflow:hidden; }
  .progress > div { height:100%; }
  .fade-in { animation: fade .2s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>

<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-600 to-indigo-700">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-6">
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-3xl font-bold mb-3">D</div>
      <h1 class="text-2xl font-bold">DompetKu</h1>
      <p class="text-sm muted mt-1">Keuangan Pribadi Aman</p>
    </div>
    
    <div class="flex gap-2 mb-4 border-b">
      <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 pb-2 font-semibold text-blue-600 border-b-2 border-blue-600">Masuk</button>
      <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 pb-2 font-semibold muted">Daftar</button>
    </div>
    
    <form id="loginForm" class="space-y-3">
      <input id="loginUser" type="text" placeholder="Username" required class="w-full rounded-lg px-3 py-2"/>
      <input id="loginPass" type="password" placeholder="Password" required class="w-full rounded-lg px-3 py-2"/>
      <div id="loginError" class="hidden text-red-500 text-sm bg-red-50 p-2 rounded"></div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Masuk</button>
    </form>
    
    <form id="registerForm" class="hidden space-y-3">
      <input id="regName" type="text" placeholder="Nama" required class="w-full rounded-lg px-3 py-2"/>
      <input id="regUser" type="text" placeholder="Username" required class="w-full rounded-lg px-3 py-2"/>
      <input id="regPass" type="password" placeholder="Password (min 6 karakter)" minlength="6" required class="w-full rounded-lg px-3 py-2"/>
      <input id="regPass2" type="password" placeholder="Konfirmasi Password" required class="w-full rounded-lg px-3 py-2"/>
      <div id="regError" class="hidden text-red-500 text-sm bg-red-50 p-2 rounded"></div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Daftar</button>
    </form>
    
    <div class="mt-4 text-center text-xs muted">🔒 Data terenkripsi di perangkat ini</div>
  </div>
</div>

<div id="appScreen" class="hidden min-h-screen">
  <header class="card border-b px-4 py-3 flex items-center gap-3 sticky top-0 z-20">
    <div class="flex-1">
      <div class="font-bold">DompetKu</div>
      <div class="text-xs muted" id="headerUser">User</div>
    </div>
    <button onclick="logout()" class="p-2 rounded hover:bg-black/5">🚪</button>
  </header>

  <main id="content" class="p-4 fade-in"></main>

  <nav class="fixed bottom-0 left-0 right-0 card border-t flex justify-around items-center z-20 pb-4">
    <a href="#/" class="bnav flex-1 flex flex-col items-center py-2 text-xs" data-route="">
      <span class="text-xl"></span><span>Home</span>
    </a>
    <a href="#/transactions" class="bnav flex-1 flex flex-col items-center py-2 text-xs" data-route="transactions">
      <span class="text-xl"></span><span>Transaksi</span>
    </a>
    <a href="#/savings" class="bnav flex-1 flex flex-col items-center py-2 text-xs" data-route="savings">
      <span class="text-xl"></span><span>Tabungan</span>
    </a>
    <a href="#/settings" class="bnav flex-1 flex flex-col items-center py-2 text-xs" data-route="settings">
      <span class="text-xl">️</span><span>Lainnya</span>
    </a>
  </nav>

  <button onclick="openTransactionForm()" class="fixed right-4 bottom-20 w-14 h-14 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white text-2xl shadow-lg z-30">＋</button>
</div>

<div id="modalRoot"></div>
<div id="toast" class="fixed bottom-24 right-4 z-50 space-y-2"></div>

<script>
const USERS_KEY = 'dompetku_users_v2';
const SESSION_KEY = 'dompetku_session_v2';

async function hashPassword(password, salt) {
  const data = new TextEncoder().encode(password + salt + 'dompetku_v2');
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function deriveKey(password, salt) {
  const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 100000, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}

async function encryptData(data, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, Array.from(salt).join(','));
  const encrypted = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(data)));
  return {
    salt: Array.from(salt).map(b=>b.toString(16).padStart(2,'0')).join(''),
    iv: Array.from(iv).map(b=>b.toString(16).padStart(2,'0')).join(''),
    data: Array.from(new Uint8Array(encrypted)).map(b=>b.toString(16).padStart(2,'0')).join('')
  };
}

async function decryptData(encObj, password) {
  try {
    const salt = new Uint8Array(encObj.salt.match(/.{2}/g).map(b=>parseInt(b,16)));
    const iv = new Uint8Array(encObj.iv.match(/.{2}/g).map(b=>parseInt(b,16)));
    const data = new Uint8Array(encObj.data.match(/.{2}/g).map(b=>parseInt(b,16)));
    const key = await deriveKey(password, Array.from(salt).join(','));
    const decrypted = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return JSON.parse(new TextDecoder().decode(decrypted));
  } catch(e) { return null; }
}

function getUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); } catch { return []; } }
function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
function getSession() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch { return null; } }
function setSession(user, password) { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId: user.id, username: user.username, _pk: password })); }
function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

function switchAuthTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
  document.getElementById('tabLogin').classList.toggle('text-blue-600', isLogin);
  document.getElementById('tabLogin').classList.toggle('border-b-2', isLogin);
  document.getElementById('tabLogin').classList.toggle('border-blue-600', isLogin);
  document.getElementById('tabLogin').classList.toggle('muted', !isLogin);
  document.getElementById('tabRegister').classList.toggle('text-blue-600', !isLogin);
  document.getElementById('tabRegister').classList.toggle('border-b-2', !isLogin);
  document.getElementById('tabRegister').classList.toggle('border-blue-600', !isLogin);
  document.getElementById('tabRegister').classList.toggle('muted', isLogin);
  document.getElementById('loginError').classList.add('hidden');
  document.getElementById('regError').classList.add('hidden');
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('loginUser').value.trim().toLowerCase();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  
  const users = getUsers();
  const user = users.find(u => u.username === username);
  if (!user) { errEl.textContent = 'Username tidak ditemukan'; errEl.classList.remove('hidden'); return; }
  
  const hash = await hashPassword(password, user.salt);
  if (hash !== user.passwordHash) { errEl.textContent = 'Password salah'; errEl.classList.remove('hidden'); return; }
  
  const encData = localStorage.getItem('dompetku_data_' + user.id);
  if (encData) {
    const decrypted = await decryptData(JSON.parse(encData), password);
    if (decrypted === null) { errEl.textContent = 'Gagal membuka data'; errEl.classList.remove('hidden'); return; }
    window.DB = decrypted;
  } else {
    window.DB = defaultDB();
  }
  
  setSession(user, password);
  showApp();
});

document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const username = document.getElementById('regUser').value.trim().toLowerCase();
  const password = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  const errEl = document.getElementById('regError');
  
  if (password !== password2) { errEl.textContent = 'Password tidak cocok'; errEl.classList.remove('hidden'); return; }
  if (password.length < 6) { errEl.textContent = 'Password minimal 6 karakter'; errEl.classList.remove('hidden'); return; }
  
  const users = getUsers();
  if (users.find(u => u.username === username)) { errEl.textContent = 'Username sudah dipakai'; errEl.classList.remove('hidden'); return; }
  
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const passwordHash = await hashPassword(password, salt);
  
  const newUser = { id: 'u_' + Date.now().toString(36), name, username, salt, passwordHash, createdAt: new Date().toISOString() };
  users.push(newUser);
  saveUsers(users);
  
  window.DB = defaultDB();
  window.DB.user.name = name;
  await saveDBEncrypted(password);
  
  setSession(newUser, password);
  toast('Akun berhasil dibuat!','success');
  showApp();
});

async function saveDBEncrypted(password) {
  const session = getSession();
  const pwd = password || session._pk;
  if (!pwd) return;
  const encrypted = await encryptData(window.DB, pwd);
  localStorage.setItem('dompetku_data_' + session.userId, JSON.stringify(encrypted));
}

function logout() {
  if (!confirm('Keluar dari aplikasi?')) return;
  clearSession();
  window.DB = null;
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  const session = getSession();
  document.getElementById('headerUser').textContent = session.username || 'User';
  if (!location.hash) location.hash = '#/';
  route();
}

function defaultDB() {
  return {
    user: { name:'User', currency:'Rp' },
    accounts: [
      { id:'a1', name:'Cash', type:'cash', opening_balance:0, balance:0, color:'#10b981' },
      { id:'a2', name:'Bank BCA', type:'bank', opening_balance:0, balance:0, color:'#3b82f6' },
      { id:'a3', name:'GoPay', type:'ewallet', opening_balance:0, balance:0, color:'#0ea5e9' },
    ],
    categories: [
      { id:'c1', name:'Gaji', type:'income', color:'#10b981', icon:'' },
      { id:'c2', name:'Bonus', type:'income', color:'#22c55e', icon:'🎁' },
      { id:'c3', name:'Freelance', type:'income', color:'#14b8a6', icon:'💻' },
      { id:'c10', name:'Makanan', type:'expense', color:'#ef4444', icon:'🍔' },
      { id:'c11', name:'Transportasi', type:'expense', color:'#f97316', icon:'' },
      { id:'c12', name:'Belanja', type:'expense', color:'#eab308', icon:'️' },
      { id:'c13', name:'Tagihan', type:'expense', color:'#a855f7', icon:'📄' },
      { id:'c16', name:'Hiburan', type:'expense', color:'#ec4899', icon:'🎬' },
      { id:'c22', name:'Lainnya', type:'expense', color:'#78716c', icon:'📦' },
      { id:'c30', name:'Dana Darurat', type:'saving', color:'#6366f1', icon:'🛟' },
      { id:'c32', name:'Tabungan Liburan', type:'saving', color:'#06b6d4', icon:'🏖️' },
      { id:'c33', name:'Tabungan Lainnya', type:'saving', color:'#10b981', icon:'🏦' },
    ],
    transactions: [],
    budgets: [],
    savings_goals: [],
    transfers: [],
    settings: { theme:'light', notifications:true }
  };
}

let saveTimer;
function saveDB(db) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveDBEncrypted(), 500);
}

function uid(p) { return p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }

const fmt = n => {
  const v = Number(n||0);
  const s = (v<0?'-':'') + Math.abs(v).toLocaleString('id-ID',{maximumFractionDigits:0});
  return (DB.user.currency||'Rp') + s;
};
const dateISO = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayISO = () => dateISO(new Date());
const monthISO = (d) => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type) {
  type = type || 'info';
  const colors = { info:'bg-blue-600', success:'bg-emerald-600', error:'bg-red-600', warn:'bg-amber-600' };
  const el = document.createElement('div');
  el.className = colors[type] + ' text-white px-4 py-2 rounded-lg shadow-lg text-sm fade-in';
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(() => el.remove(), 300); }, 2800);
}

function confirmDialog(title, message) {
  return new Promise(resolve => {
    openModal(
      '<h3 class="text-lg font-bold mb-2">' + esc(title) + '</h3>' +
      '<p class="muted text-sm mb-4">' + esc(message) + '</p>' +
      '<div class="flex justify-end gap-2">' +
      '<button class="px-4 py-2 rounded-lg border" data-close>Batal</button>' +
      '<button class="px-4 py-2 rounded-lg bg-red-600 text-white" id="confirmYes">Ya</button>' +
      '</div>',
      { 
        onMount: root => { root.querySelector('#confirmYes').onclick = () => { closeModal(); resolve(true); }; },
        onClose: () => resolve(false)
      }
    );
  });
}

function openModal(html, opts) {
  opts = opts || {};
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="fixed inset-0 z-40 modal-bg flex items-end md:items-center justify-center p-0 md:p-4"><div class="card rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-lg max-h-[90vh] overflow-auto fade-in p-6">' + html + '</div></div>';
  const box = root.querySelector('.card');
  box.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { closeModal(); if(opts.onClose) opts.onClose(); });
  root.addEventListener('click', e => { if(e.target === root.firstElementChild) { closeModal(); if(opts.onClose) opts.onClose(); } }, { once:true });
  if(opts.onMount) opts.onMount(box);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

function recomputeBalances(db) {
  db.accounts.forEach(a => a.balance = Number(a.opening_balance||0));
  db.transactions.filter(t => t.status === 'done').forEach(t => {
    const acc = db.accounts.find(a => a.id === t.account_id);
    if(!acc) return;
    if(t.type === 'income') acc.balance += Number(t.amount);
    else if(t.type === 'expense') acc.balance -= Number(t.amount);
  });
  if(db.transfers) {
    db.transfers.forEach(tr => {
      const fromAcc = db.accounts.find(a => a.id === tr.from_account_id);
      const toAcc = db.accounts.find(a => a.id === tr.to_account_id);
      if(fromAcc) fromAcc.balance -= Number(tr.amount);
      if(toAcc) toAcc.balance += Number(tr.amount);
    });
  }
}

function getTotalAllocated(db) { return db.savings_goals.reduce((s,g) => s + Number(g.current||0), 0); }
function getAvailableBalance(db) { return Math.max(0, DB.accounts.reduce((s,a) => s + Number(a.balance||0), 0) - getTotalAllocated(db)); }

const routes = {
  '': { title:'Dashboard', render: renderDashboard },
  'transactions': { title:'Transaksi', render: renderTransactions },
  'savings': { title:'Tabungan', render: renderSavings },
  'settings': { title:'Pengaturan', render: renderSettings },
};

function route() {
  const hash = (location.hash || '#/').slice(2);
  const r = routes[hash] || routes[''];
  document.querySelectorAll('.bnav').forEach(el => {
    const isActive = el.dataset.route === hash;
    el.classList.toggle('text-blue-600', isActive);
    el.classList.toggle('muted', !isActive);
  });
  const c = document.getElementById('content');
  c.classList.remove('fade-in'); void c.offsetWidth; c.classList.add('fade-in');
  r.render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

function renderDashboard() {
  const cm = monthISO();
  const txs = DB.transactions.filter(t => t.transaction_date.startsWith(cm) && t.status === 'done');
  const income = txs.filter(t => t.type === 'income').reduce((s,t) => s + Number(t.amount), 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s,t) => s + Number(t.amount), 0);
  const saving = txs.filter(t => t.type === 'saving').reduce((s,t) => s + Number(t.amount), 0);
  const totalBalance = DB.accounts.reduce((s,a) => s + Number(a.balance||0), 0);
  const totalAllocated = getTotalAllocated(DB);
  const availableBalance = getAvailableBalance(DB);

  const html = '<div class="mb-4">' +
    '<h1 class="text-2xl font-bold">Dashboard</h1>' +
    '<p class="muted text-sm">' + new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric'}) + '</p>' +
    '</div>' +
    '<div class="card rounded-2xl p-4 mb-4 bg-gradient-to-br from-blue-600 to-indigo-700 text-white">' +
    '<div class="text-xs opacity-80 mb-1">💰 Saldo Total</div>' +
    '<div class="text-3xl font-bold mb-3">' + fmt(totalBalance) + '</div>' +
    '<div class="grid grid-cols-2 gap-2">' +
    '<div class="bg-white/10 rounded-lg p-2"><div class="text-xs opacity-80">🏦 Dialokasikan</div><div class="text-sm font-bold">' + fmt(totalAllocated) + '</div></div>' +
    '<div class="bg-white/10 rounded-lg p-2"><div class="text-xs opacity-80">✅ Siap Pakai</div><div class="text-sm font-bold">' + fmt(availableBalance) + '</div></div>' +
    '</div></div>' +
    '<div class="grid grid-cols-2 gap-2 mb-4">' +
    '<div class="card rounded-xl p-3"><div class="text-xs muted">📥 Pemasukan</div><div class="text-lg font-bold text-emerald-600">' + fmt(income) + '</div></div>' +
    '<div class="card rounded-xl p-3"><div class="text-xs muted">📤 Pengeluaran</div><div class="text-lg font-bold text-red-600">' + fmt(expense) + '</div></div>' +
    '<div class="card rounded-xl p-3"><div class="text-xs muted">🏦 Tabungan</div><div class="text-lg font-bold text-indigo-600">' + fmt(saving) + '</div></div>' +
    '<div class="card rounded-xl p-3"><div class="text-xs muted">💳 Transaksi</div><div class="text-lg font-bold">' + txs.length + '</div></div>' +
    '</div>' +
    '<div class="card rounded-2xl p-4">' +
    '<div class="flex items-center justify-between mb-3"><h3 class="font-semibold">Transaksi Terbaru</h3><a href="#/transactions" class="text-blue-600 text-sm">Lihat →</a></div>' +
    renderRecentTx() +
    '</div>';
  
  document.getElementById('content').innerHTML = html;
}

function renderRecentTx() {
  const recent = DB.transactions.slice().sort((a,b) => b.transaction_date.localeCompare(a.transaction_date)).slice(0,5);
  if(recent.length === 0) return '<div class="text-center py-6 muted text-sm">Belum ada transaksi</div>';
  return recent.map(t => {
    const cat = DB.categories.find(c => c.id === t.category_id);
    const chip = t.type === 'income' ? 'chip-inc' : t.type === 'expense' ? 'chip-exp' : 'chip-sav';
    const color = t.type === 'income' ? 'text-emerald-600' : t.type === 'expense' ? 'text-red-600' : 'text-indigo-600';
    const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '';
    return '<div class="flex items-center gap-2 p-2 border-b last:border-0">' +
      '<div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background:' + (cat?.color||'#888') + '22">' + (cat?.icon||'💸') + '</div>' +
      '<div class="flex-1 min-w-0">' +
      '<div class="font-medium text-sm truncate">' + esc(t.description||cat?.name||'-') + '</div>' +
      '<div class="text-xs muted">' + fmtDate(t.transaction_date) + ' • <span class="chip ' + chip + '">' + (cat?.name||'-') + '</span></div>' +
      '</div>' +
      '<div class="font-bold text-sm ' + color + '">' + sign + fmt(t.amount) + '</div>' +
      '</div>';
  }).join('');
}

let txFilter = { search:'', type:'' };

function renderTransactions() {
  const html = '<div class="mb-4">' +
    '<h1 class="text-2xl font-bold">Transaksi</h1>' +
    '<p class="muted text-sm">Semua transaksi Anda</p>' +
    '</div>' +
    '<div class="card rounded-xl p-3 mb-4 space-y-2">' +
    '<input id="fSearch" placeholder=" Cari..." class="w-full rounded-lg px-3 py-2 text-sm" value="' + esc(txFilter.search) + '"/>' +
    '<select id="fType" class="w-full rounded-lg px-3 py-2 text-sm">' +
    '<option value="">Semua jenis</option>' +
    '<option value="income">Pemasukan</option>' +
    '<option value="expense">Pengeluaran</option>' +
    '<option value="saving">Tabungan</option>' +
    '</select></div>' +
    '<div class="card rounded-xl overflow-hidden"><div id="txList"></div></div>';
  
  document.getElementById('content').innerHTML = html;
  document.getElementById('fSearch').addEventListener('input', e => { txFilter.search = e.target.value; renderTxList(); });
  document.getElementById('fType').addEventListener('change', e => { txFilter.type = e.target.value; renderTxList(); });
  renderTxList();
}

function renderTxList() {
  let list = DB.transactions.slice();
  if(txFilter.search) {
    const q = txFilter.search.toLowerCase();
    list = list.filter(t => (t.description||'').toLowerCase().includes(q));
  }
  if(txFilter.type) list = list.filter(t => t.type === txFilter.type);
  list.sort((a,b) => b.transaction_date.localeCompare(a.transaction_date));
  
  const box = document.getElementById('txList');
  if(list.length === 0) {
    box.innerHTML = '<div class="text-center py-12 muted text-sm">Tidak ada transaksi</div>';
    return;
  }
  box.innerHTML = list.map(t => {
    const cat = DB.categories.find(c => c.id === t.category_id);
    const chip = t.type === 'income' ? 'chip-inc' : t.type === 'expense' ? 'chip-exp' : 'chip-sav';
    const color = t.type === 'income' ? 'text-emerald-600' : t.type === 'expense' ? 'text-red-600' : 'text-indigo-600';
    const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '';
    return '<div class="flex items-center gap-2 p-3 border-b last:border-0">' +
      '<div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0" style="background:' + (cat?.color||'#888') + '22">' + (cat?.icon||'💸') + '</div>' +
      '<div class="flex-1 min-w-0">' +
      '<div class="font-medium text-sm truncate">' + esc(t.description||cat?.name||'-') + '</div>' +
      '<div class="text-xs muted">' + fmtDate(t.transaction_date) + ' • <span class="chip ' + chip + '">' + (cat?.name||'-') + '</span></div>' +
      '</div>' +
      '<div class="text-right flex-shrink-0">' +
      '<div class="font-bold text-sm ' + color + '">' + sign + fmt(t.amount) + '</div>' +
      '<div class="flex gap-1 justify-end mt-1">' +
      '<button onclick="openTransactionForm(\'' + t.id + '\')" class="text-xs p-1">✏️</button>' +
      '<button onclick="deleteTx(\'' + t.id + '\')" class="text-xs p-1">🗑️</button>' +
      '</div></div></div>';
  }).join('');
}

async function deleteTx(id) {
  if(!await confirmDialog('Hapus transaksi?','Data tidak bisa dikembalikan.')) return;
  DB.transactions = DB.transactions.filter(t => t.id !== id);
  recomputeBalances(DB); saveDB(DB);
  toast('Dihapus','success');
  route();
}

function openTransactionForm(id) {
  const t = id ? DB.transactions.find(x => x.id === id) : null;
  const isEdit = !!t;
  const html = '<h3 class="text-lg font-bold mb-4">' + (isEdit ? 'Edit' : 'Tambah') + ' Transaksi</h3>' +
    '<form id="txForm" class="space-y-3">' +
    '<div class="grid grid-cols-3 gap-2">' +
    '<label class="cursor-pointer"><input type="radio" name="type" value="income" class="hidden peer" ' + ((!isEdit && false)||(t?.type==='income')?'checked':'') + '/>' +
    '<div class="peer-checked:ring-2 peer-checked:ring-blue-500 p-2 rounded-lg border text-center text-xs">📥 Masuk</div></label>' +
    '<label class="cursor-pointer"><input type="radio" name="type" value="expense" class="hidden peer" ' + ((!isEdit)||(t?.type==='expense')?'checked':'') + '/>' +
    '<div class="peer-checked:ring-2 peer-checked:ring-blue-500 p-2 rounded-lg border text-center text-xs">📤 Keluar</div></label>' +
    '<label class="cursor-pointer"><input type="radio" name="type" value="saving" class="hidden peer" ' + ((t?.type==='saving')?'checked':'') + '/>' +
    '<div class="peer-checked:ring-2 peer-checked:ring-blue-500 p-2 rounded-lg border text-center text-xs"> Tabung</div></label>' +
    '</div>' +
    '<div><label class="text-xs muted">Nominal</label><input name="amount" type="number" min="1" required class="w-full rounded-lg px-3 py-2" value="' + (t?.amount||'') + '" placeholder="0"/></div>' +
    '<div class="grid grid-cols-2 gap-2">' +
    '<div><label class="text-xs muted">Tanggal</label><input name="date" type="date" required class="w-full rounded-lg px-3 py-2" value="' + (t?.transaction_date||todayISO()) + '"/></div>' +
    '<div><label class="text-xs muted">Rekening</label><select name="account_id" class="w-full rounded-lg px-3 py-2">' +
    DB.accounts.map(a => '<option value="' + a.id + '" ' + (t?.account_id===a.id?'selected':'') + '>' + esc(a.name) + '</option>').join('') +
    '</select></div></div>' +
    '<div><label class="text-xs muted">Kategori</label><select name="category_id" id="catSel" class="w-full rounded-lg px-3 py-2"></select></div>' +
    '<div><label class="text-xs muted">Deskripsi</label><input name="description" class="w-full rounded-lg px-3 py-2" value="' + esc(t?.description||'') + '" placeholder="Contoh: Makan siang"/></div>' +
    '<div class="flex justify-end gap-2">' +
    '<button type="button" class="px-4 py-2 rounded-lg border" data-close>Batal</button>' +
    '<button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">Simpan</button>' +
    '</div></form>';
  
  openModal(html, { onMount: root => {
    const form = root.querySelector('#txForm');
    const catSel = root.querySelector('#catSel');
    const refreshCats = () => {
      const type = form.querySelector('input[name=type]:checked').value;
      const cats = DB.categories.filter(c => c.type === type);
      catSel.innerHTML = cats.map(c => '<option value="' + c.id + '" ' + (t?.category_id===c.id?'selected':'') + '>' + c.icon + ' ' + esc(c.name) + '</option>').join('');
    };
    refreshCats();
    form.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', refreshCats));
    form.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(form);
      const amount = Number(fd.get('amount'));
      if(!amount || amount <= 0) { toast('Nominal harus > 0','error'); return; }
      const data = {
        account_id: fd.get('account_id'),
        category_id: fd.get('category_id'),
        type: fd.get('type'),
        amount,
        transaction_date: fd.get('date'),
        description: fd.get('description')||'',
        status: 'done',
      };
      if(isEdit) Object.assign(t, data);
      else DB.transactions.push({ id: uid('t'), ...data });
      recomputeBalances(DB); saveDB(DB);
      closeModal(); toast(isEdit ? 'Diperbarui' : 'Ditambahkan','success');
      route();
    });
  }});
}

function renderSavings() {
  const goals = DB.savings_goals;
  const totalBalance = DB.accounts.reduce((s,a) => s + Number(a.balance||0), 0);
  const totalAllocated = getTotalAllocated(DB);

  let html = '<div class="mb-4"><h1 class="text-2xl font-bold">Target Tabungan</h1><p class="muted text-sm">Alokasi virtual dari saldo Anda</p></div>' +
    '<div class="card rounded-xl p-4 mb-4 bg-gradient-to-br from-indigo-50 to-purple-50">' +
    '<div class="grid grid-cols-2 gap-2 text-center">' +
    '<div><div class="text-xs muted">Saldo Fisik</div><div class="text-lg font-bold text-blue-600">' + fmt(totalBalance) + '</div></div>' +
    '<div><div class="text-xs muted">Dialokasikan</div><div class="text-lg font-bold text-purple-600">' + fmt(totalAllocated) + '</div></div>' +
    '</div></div>' +
    '<button onclick="openGoalForm()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold mb-4">＋ Target Baru</button>' +
    '<div class="space-y-3">';
  
  if(goals.length === 0) {
    html += '<div class="card rounded-xl p-8 text-center muted text-sm">Belum ada target tabungan</div>';
  }
  
  goals.forEach(g => {
    const pct = g.target > 0 ? (g.current/g.target*100) : 0;
    const days = daysBetween(todayISO(), g.deadline);
    const monthly = days > 0 ? Math.ceil((g.target-g.current)/(days/30)) : 0;
    const color = pct >= 100 ? 'bg-emerald-500' : pct >= 60 ? 'bg-indigo-500' : 'bg-amber-500';
    html += '<div class="card rounded-xl p-4">' +
      '<div class="flex items-start justify-between mb-2">' +
      '<div class="flex-1 min-w-0"><div class="font-bold truncate">' + esc(g.name) + '</div><div class="text-xs muted">Target: ' + fmt(g.target) + '</div></div>' +
      '<div class="flex gap-1">' +
      '<button onclick="addSaving(\'' + g.id + '\')" class="p-2">💵</button>' +
      '<button onclick="openGoalForm(\'' + g.id + '\')" class="p-2">✏️</button>' +
      '<button onclick="deleteGoal(\'' + g.id + '\')" class="p-2">🗑️</button>' +
      '</div></div>' +
      '<div class="flex items-baseline gap-1 mb-2"><div class="text-xl font-bold">' + fmt(g.current) + '</div><div class="text-xs muted">/ ' + fmt(g.target) + '</div></div>' +
      '<div class="progress mb-2"><div class="' + color + '" style="width:' + Math.min(100,pct) + '%"></div></div>' +
      '<div class="flex justify-between text-xs muted"><span>' + pct.toFixed(1) + '% progress</span><span>' + (days > 0 ? days + ' hari lagi' : 'Terlewat') + '</span></div>';
    if(days > 0) {
      html += '<div class="text-xs mt-2 p-2 rounded bg-indigo-50 text-indigo-600"><b>~' + fmt(monthly) + '/bulan</b> untuk mencapai target</div>';
    }
    html += '</div>';
  });
  
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function openGoalForm(id) {
  const g = id ? DB.savings_goals.find(x => x.id === id) : null;
  const html = '<h3 class="text-lg font-bold mb-4">' + (g ? 'Edit' : 'Tambah') + ' Target</h3>' +
    '<form id="gForm" class="space-y-3">' +
    '<div><label class="text-xs muted">Nama</label><input name="name" required class="w-full rounded-lg px-3 py-2" value="' + esc(g?.name||'') + '"/></div>' +
    '<div class="grid grid-cols-2 gap-2">' +
    '<div><label class="text-xs muted">Target</label><input name="target" type="number" min="1" required class="w-full rounded-lg px-3 py-2" value="' + (g?.target||'') + '"/></div>' +
    '<div><label class="text-xs muted">Saat ini</label><input name="current" type="number" min="0" required class="w-full rounded-lg px-3 py-2" value="' + (g?.current||0) + '"/></div>' +
    '</div>' +
    '<div><label class="text-xs muted">Deadline</label><input name="deadline" type="date" required class="w-full rounded-lg px-3 py-2" value="' + (g?.deadline||'') + '"/></div>' +
    '<div class="flex justify-end gap-2">' +
    '<button type="button" class="px-4 py-2 rounded-lg border" data-close>Batal</button>' +
    '<button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">Simpan</button>' +
    '</div></form>';
  
  openModal(html, { onMount: root => {
    root.querySelector('#gForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = { name: fd.get('name'), target: Number(fd.get('target')), current: Number(fd.get('current')), deadline: fd.get('deadline') };
      if(g) Object.assign(g, data);
      else DB.savings_goals.push({ id: uid('g'), ...data });
      saveDB(DB); closeModal(); toast('Tersimpan','success'); renderSavings();
    });
  }});
}

function addSaving(id) {
  const html = '<h3 class="text-lg font-bold mb-2">💵 Tambah Alokasi</h3>' +
    '<div class="p-2 rounded-lg bg-indigo-50 text-xs mb-3">Saldo rekening fisik tidak berubah.</div>' +
    '<form id="addForm" class="space-y-3">' +
    '<div><label class="text-xs muted">Nominal</label><input name="amount" type="number" min="1" required class="w-full rounded-lg px-3 py-2"/></div>' +
    '<div><label class="text-xs muted">Tanggal</label><input name="date" type="date" required class="w-full rounded-lg px-3 py-2" value="' + todayISO() + '"/></div>' +
    '<div class="flex justify-end gap-2">' +
    '<button type="button" class="px-4 py-2 rounded-lg border" data-close>Batal</button>' +
    '<button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">Tambah</button>' +
    '</div></form>';
  
  openModal(html, { onMount: root => {
    root.querySelector('#addForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const g = DB.savings_goals.find(x => x.id === id);
      const amount = Number(fd.get('amount'));
      g.current += amount;
      DB.transactions.push({ id: uid('t'), account_id: DB.accounts[0].id, category_id: 'c33', type: 'saving', amount, transaction_date: fd.get('date'), description: 'Alokasi: ' + g.name, status: 'done' });
      saveDB(DB); closeModal(); toast('Ditambahkan','success'); renderSavings();
    });
  }});
}

async function deleteGoal(id) {
  if(!await confirmDialog('Hapus target?','Target akan dihapus.')) return;
  DB.savings_goals = DB.savings_goals.filter(g => g.id !== id); saveDB(DB); toast('Dihapus','success'); renderSavings();
}

function renderSettings() {
  const session = getSession();
  const html = '<div class="mb-4"><h1 class="text-2xl font-bold">Pengaturan</h1><p class="muted text-sm">Profil & data</p></div>' +
    '<div class="card rounded-xl p-4 mb-3">' +
    '<div class="flex items-center gap-3 mb-3">' +
    '<div class="w-12 h-12 rounded-full bg-gradient-to-br from-emerald-400 to-blue-500 flex items-center justify-center text-white font-bold text-lg">' + (session?.username||'U')[0].toUpperCase() + '</div>' +
    '<div><div class="font-bold">' + esc(session?.username||'User') + '</div><div class="text-xs muted">🔒 Data terenkripsi</div></div>' +
    '</div>' +
    '<button onclick="logout()" class="w-full bg-red-50 text-red-600 py-2 rounded-lg font-semibold">🚪 Keluar</button>' +
    '</div>' +
    '<div class="card rounded-xl p-4 mb-3"><h3 class="font-semibold mb-3">📱 Install di HP</h3><div class="text-sm muted space-y-1"><div>📲 <b>Android:</b> Menu ⋮ → "Install app"</div><div>📲 <b>iPhone:</b> Share → "Add to Home Screen"</div></div></div>' +
    '<div class="card rounded-xl p-4 mb-3"><h3 class="font-semibold mb-3">️ Backup</h3><button onclick="exportJSON()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm mb-2">Export JSON Backup</button><button onclick="exportCSV()" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm">Export CSV</button></div>' +
    '<div class="card rounded-xl p-4 mb-3"><h3 class="font-semibold mb-3">️ Import</h3><input id="impFile" type="file" accept=".json" class="w-full text-sm mb-2"/><button onclick="importFile()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm">Import</button></div>' +
    '<div class="card rounded-xl p-4"><h3 class="font-semibold mb-3 text-red-600">️ Reset</h3><button onclick="resetAll()" class="w-full bg-red-600 text-white py-2 rounded-lg text-sm">Reset Semua Data</button></div>';
  
  document.getElementById('content').innerHTML = html;
}

async function resetAll() {
  if(!await confirmDialog('Reset semua data?','Semua data akan dihapus.')) return;
  window.DB = defaultDB();
  window.DB.user.name = getSession()?.username || 'User';
  await saveDBEncrypted();
  toast('Data direset','success');
  route();
}

function exportCSV() {
  const list = DB.transactions.slice().sort((a,b) => a.transaction_date.localeCompare(b.transaction_date));
  const header = ['tanggal','jenis','kategori','nominal','deskripsi'];
  const rows = list.map(t => {
    const cat = DB.categories.find(c => c.id === t.category_id);
    return [t.transaction_date, t.type, cat?.name||'', t.amount, (t.description||'').replace(/"/g,'""')].map(v => '"' + v + '"').join(',');
  });
  downloadFile([header.join(','), ...rows].join('\n'), 'dompetku_' + todayISO() + '.csv', 'text/csv');
  toast('CSV diekspor','success');
}

function exportJSON() {
  downloadFile(JSON.stringify(DB, null, 2), 'dompetku_backup_' + todayISO() + '.json', 'application/json');
  toast('Backup diekspor','success');
}

function downloadFile(content, name, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function importFile() {
  const f = document.getElementById('impFile').files[0];
  if(!f) { toast('Pilih file','error'); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      if(confirm('Timpa data saat ini?')) {
        window.DB = data;
        recomputeBalances(DB);
        await saveDBEncrypted();
        toast('Data diimpor','success');
        route();
      }
    } catch(err) { toast('File tidak valid','error'); }
  };
  reader.readAsText(f);
}

const session = getSession();
if(session && session.userId) {
  const encData = localStorage.getItem('dompetku_data_' + session.userId);
  if(encData) {
    decryptData(JSON.parse(encData), session._pk).then(data => {
      if(data) { window.DB = data; showApp(); }
      else { clearSession(); document.getElementById('loginScreen').classList.remove('hidden'); }
    });
  } else {
    window.DB = defaultDB();
    showApp();
  }
} else {
  document.getElementById('loginScreen').classList.remove('hidden');
}
</script>
