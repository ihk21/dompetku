<script>
/* =========================================================
   AUTH & ENCRYPTION LAYER
   ========================================================= */
const USERS_KEY = 'dompetku_users_v2';
const SESSION_KEY = 'dompetku_session_v2';

// Hash password dengan SHA-256
async function hashPassword(password, salt='') {
  const encoder = new TextEncoder();
  const data = encoder.encode(password + salt + 'dompetku_v2_pepper');
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Derive encryption key dari password (PBKDF2)
async function deriveKey(password, salt) {
  const encoder = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: encoder.encode(salt), iterations: 100000, hash:'SHA-256' },
    keyMaterial,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}

// Encrypt data
async function encryptData(data, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, Array.from(salt).join(','));
  const encoder = new TextEncoder();
  const encrypted = await crypto.subtle.encrypt(
    { name:'AES-GCM', iv },
    key,
    encoder.encode(JSON.stringify(data))
  );
  return {
    salt: Array.from(salt).map(b=>b.toString(16).padStart(2,'0')).join(''),
    iv: Array.from(iv).map(b=>b.toString(16).padStart(2,'0')).join(''),
    data: Array.from(new Uint8Array(encrypted)).map(b=>b.toString(16).padStart(2,'0')).join('')
  };
}

// Decrypt data
async function decryptData(encObj, password) {
  try {
    const salt = new Uint8Array(encObj.salt.match(/.{2}/g).map(b=>parseInt(b,16)));
    const iv = new Uint8Array(encObj.iv.match(/.{2}/g).map(b=>parseInt(b,16)));
    const data = new Uint8Array(encObj.data.match(/.{2}/g).map(b=>parseInt(b,16)));
    const key = await deriveKey(password, Array.from(salt).join(','));
    const decrypted = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return JSON.parse(new TextDecoder().decode(decrypted));
  } catch(e) {
    return null;
  }
}

// Get/Set users list
function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); }
  catch { return []; }
}
function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }

// Session
function getSession() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); }
  catch { return null; }
}
function setSession(user, password) {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ 
    userId: user.id, 
    username: user.username,
    // Password disimpan di sessionStorage (hilang saat tab ditutup) untuk enkripsi
    _pk: password 
  }));
}
function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

/* =========================================================
   AUTH UI
   ========================================================= */
function switchAuthTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
  document.getElementById('tabLogin').classList.toggle('text-blue-600', isLogin);
  document.getElementById('tabLogin').classList.toggle('border-b-2', isLogin);
  document.getElementById('tabLogin').classList.toggle('border-blue-600', isLogin);
  document.getElementById('tabLogin').classList.toggle('text-slate-500', !isLogin);
  document.getElementById('tabRegister').classList.toggle('text-blue-600', !isLogin);
  document.getElementById('tabRegister').classList.toggle('border-b-2', !isLogin);
  document.getElementById('tabRegister').classList.toggle('border-blue-600', !isLogin);
  document.getElementById('tabRegister').classList.toggle('text-slate-500', isLogin);
  document.getElementById('loginError').classList.add('hidden');
  document.getElementById('regError').classList.add('hidden');
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('loginUser').value.trim().toLowerCase();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  
  const users = getUsers();
  const user = users.find(u => u.username === username);
  if (!user) {
    errEl.textContent = 'Username tidak ditemukan';
    errEl.classList.remove('hidden');
    return;
  }
  
  const hash = await hashPassword(password, user.salt);
  if (hash !== user.passwordHash) {
    errEl.textContent = 'Password salah';
    errEl.classList.remove('hidden');
    return;
  }
  
  // Decrypt user data
  const encData = localStorage.getItem(`dompetku_data_${user.id}`);
  if (encData) {
    try {
      const decrypted = await decryptData(JSON.parse(encData), password);
      if (decrypted === null) {
        errEl.textContent = 'Gagal membuka data. Password mungkin berubah.';
        errEl.classList.remove('hidden');
        return;
      }
      window.DB = decrypted;
    } catch {
      errEl.textContent = 'Data rusak. Hubungi admin.';
      errEl.classList.remove('hidden');
      return;
    }
  } else {
    window.DB = defaultDB();
  }
  
  setSession(user, password);
  showApp();
});

document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const username = document.getElementById('regUser').value.trim().toLowerCase();
  const password = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  const errEl = document.getElementById('regError');
  
  if (password !== password2) {
    errEl.textContent = 'Konfirmasi password tidak cocok';
    errEl.classList.remove('hidden');
    return;
  }
  if (password.length < 6) {
    errEl.textContent = 'Password minimal 6 karakter';
    errEl.classList.remove('hidden');
    return;
  }
  
  const users = getUsers();
  if (users.find(u => u.username === username)) {
    errEl.textContent = 'Username sudah dipakai';
    errEl.classList.remove('hidden');
    return;
  }
  
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const passwordHash = await hashPassword(password, salt);
  
  const newUser = {
    id: 'u_' + Date.now().toString(36),
    name, username, salt, passwordHash,
    createdAt: new Date().toISOString()
  };
  users.push(newUser);
  saveUsers(users);
  
  // Initialize empty DB for new user
  window.DB = defaultDB();
  window.DB.user.name = name;
  await saveDBEncrypted(password);
  
  setSession(newUser, password);
  toast('Akun berhasil dibuat!','success');
  showApp();
});

async function saveDBEncrypted(password) {
  const session = getSession();
  const pwd = password || session?._pk;
  if (!pwd) return;
  const encrypted = await encryptData(window.DB, pwd);
  localStorage.setItem(`dompetku_data_${session.userId}`, JSON.stringify(encrypted));
}

function logout() {
  if (!confirm('Keluar dari aplikasi?')) return;
  clearSession();
  window.DB = null;
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginScreen').classList.add('flex');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

async function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('flex');
  document.getElementById('appScreen').classList.remove('hidden');
  const session = getSession();
  document.getElementById('sidebarUser').textContent = session?.username || 'User';
  document.getElementById('drawerUser').textContent = session?.username || 'User';
  applyTheme();
  if (!location.hash) location.hash = '#/';
  route();
  checkNotifications();
}

/* =========================================================
   DATABASE LAYER
   ========================================================= */
const defaultDB = () => ({
  user: { name:'User', currency:'Rp' },
  accounts: [
    { id:'a1', name:'Cash', type:'cash', opening_balance:0, balance:0, color:'#10b981' },
    { id:'a2', name:'Bank BCA', type:'bank', opening_balance:0, balance:0, color:'#3b82f6' },
    { id:'a3', name:'GoPay', type:'ewallet', opening_balance:0, balance:0, color:'#0ea5e9' },
  ],
  categories: [
    { id:'c1', name:'Gaji', type:'income', color:'#10b981', icon:'💼' },
    { id:'c2', name:'Bonus', type:'income', color:'#22c55e', icon:'🎁' },
    { id:'c3', name:'Freelance', type:'income', color:'#14b8a6', icon:'💻' },

/* =========================================================
   BALANCE RECOMPUTE (Opsi B: Tabungan tidak kurangi saldo)
   ========================================================= */
function recomputeBalances(db){
  db.accounts.forEach(a=> a.balance = Number(a.opening_balance||0));
  db.transactions.filter(t=>t.status==='done').forEach(t=>{
    const acc = db.accounts.find(a=>a.id===t.account_id);
    if(!acc) return;
    if(t.type==='income') acc.balance += Number(t.amount);
    else if(t.type==='expense') acc.balance -= Number(t.amount);
    // saving TIDAK mempengaruhi saldo rekening
  });
  if(db.transfers){
    db.transfers.forEach(tr=>{
      const fromAcc = db.accounts.find(a=>a.id===tr.from_account_id);
      const toAcc = db.accounts.find(a=>a.id===tr.to_account_id);
      if(fromAcc) fromAcc.balance -= Number(tr.amount);
      if(toAcc) toAcc.balance += Number(tr.amount);
    });
  }
}

function getTotalAllocated(db){
  return db.savings_goals.reduce((s,g)=> s + Number(g.current||0), 0);
}
function getAvailableBalance(db){
  const totalBalance = db.accounts.reduce((s,a)=> s + Number(a.balance||0), 0);
  const allocated = getTotalAllocated(db);
  return Math.max(0, totalBalance - allocated);
}

function drawIncomeExpenseChart(){
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    months.push({ key: monthISO(d), label: d.toLocaleDateString('id-ID',{month:'short'}) });
  }
  const inc=[], exp=[];
  months.forEach(m=>{
    const txs = DB.transactions.filter(t=>t.transaction_date.startsWith(m.key) && t.status==='done');
    inc.push(txs.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0));
    exp.push(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0));
  });
  const isDark = document.documentElement.classList.contains('dark');
  const grid = isDark?'#1f2a44':'#e5e7eb';
  const text = isDark?'#cbd5e1':'#475569';
  new Chart(document.getElementById('chartIncomeExpense'),{
    type:'bar',
    data:{ labels:months.map(m=>m.label), datasets:[
      { label:'Pemasukan', data:inc, backgroundColor:'#10b981', borderRadius:6 },
      { label:'Pengeluaran', data:exp, backgroundColor:'#ef4444', borderRadius:6 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{color:text, font:{size:11}} } },
      scales:{ x:{ ticks:{color:text, font:{size:10}}, grid:{display:false} }, y:{ ticks:{color:text, font:{size:10}, callback:v=>'Rp'+(v/1000000).toFixed(1)+'jt'}, grid:{color:grid} } }
    }
  });
}

function drawCategoryChart(txs){
  const expTxs = txs.filter(t=>t.type==='expense');
  const byCat = {};
  expTxs.forEach(t=>{ byCat[t.category_id] = (byCat[t.category_id]||0)+Number(t.amount); });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,7);
  if(entries.length===0){
    document.getElementById('chartCategory').parentElement.innerHTML = '<div class="muted text-sm text-center py-8">Belum ada pengeluaran</div>';
    return;
  }
  const labels = entries.map(([id])=> DB.categories.find(c=>c.id===id)?.name||'-');
  const data = entries.map(([,v])=>v);
  const colors = entries.map(([id])=> DB.categories.find(c=>c.id===id)?.color||'#888');
  const isDark = document.documentElement.classList.contains('dark');
  const text = isDark?'#cbd5e1':'#475569';
  new Chart(document.getElementById('chartCategory'),{
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'65%',
      plugins:{ legend:{ position:'bottom', labels:{color:text, boxWidth:10, font:{size:10}} } }
    }
  });
}

function buildInsights(){
  const cm = monthISO();
  const pm = new Date(); pm.setDate(1); pm.setMonth(pm.getMonth()-1); const pmKey = monthISO(pm);
  const cur = DB.transactions.filter(t=>t.transaction_date.startsWith(cm) && t.status==='done');
  const prev = DB.transactions.filter(t=>t.transaction_date.startsWith(pmKey) && t.status==='done');
  const ins = [];

  const byCat = {};
  cur.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category_id]=(byCat[t.category_id]||0)+Number(t.amount); });
  const totalExp = cur.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  if(top){
    const cat = DB.categories.find(c=>c.id===top[0]);
    const pct = totalExp>0 ? (top[1]/totalExp*100).toFixed(0) : 0;
    ins.push({ type:'info', text:`Pengeluaran terbesar: <b>${cat?.icon||''} ${esc(cat?.name)}</b> ${fmt(top[1])} (${pct}%).` });
  }

  const curExp = cur.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const prevExp = prev.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  if(prevExp>0){
    const delta = curExp - prevExp;
    const pct = (delta/prevExp*100).toFixed(1);
    if(Math.abs(delta)>50000){
      ins.push({ type: delta>0?'warn':'success',
        text: delta>0 ? `Pengeluaran naik <b>${fmt(delta)}</b> (+${pct}%) dari bulan lalu.` : `Pengeluaran turun <b>${fmt(Math.abs(delta))}</b>. Bagus!` });
    }
  }

  const income = cur.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const saving = cur.filter(t=>t.type==='saving').reduce((s,t)=>s+Number(t.amount),0);
  if(income>0){
    const rate = (saving/income*100).toFixed(1);
    ins.push({ type: rate>=20?'success':rate>=10?'info':'warn', text:`Saving rate: <b>${rate}%</b>${rate>=20?' — sehat':rate>=10?' — cukup':' — perlu ditingkat'}.` });
  }

  return ins;
}

function renderInsights(ins){
  const box = document.getElementById('insightBox');
  if(ins.length===0){ box.innerHTML = `<div class="muted text-sm">Belum ada insight.</div>`; return; }
  const icons = { info:'ℹ️', success:'✅', warn:'⚠️', error:'🚨' };
  box.innerHTML = ins.map(i=>`

        </select>
        <select id="fSort" class="rounded-lg px-3 py-2 text-sm">
          <option value="sort_date_desc">Terbaru</option>
          <option value="sort_date_asc">Terlama</option>
          <option value="sort_amount_desc">Nominal ↓</option>
          <option value="sort_amount_asc">Nominal ↑</option>
        </select>
      </div>
    </div>

    <div class="card rounded-2xl overflow-hidden">
      <div id="txList"></div>
      <div id="txPager" class="p-3 flex justify-between items-center text-sm muted border-t border-divider"></div>
    </div>
  `;
  document.getElementById('fSearch').addEventListener('input', e=>{ txFilter.search = e.target.value; txPage=1; renderTxList(); });
  document.getElementById('fType').addEventListener('change', e=>{ txFilter.type = e.target.value; txPage=1; renderTxList(); });
  document.getElementById('fSort').addEventListener('change', e=>{ txFilter.sort = e.target.value; renderTxList(); });
  renderTxList();
}

function renderTxList(){
  let list = [...DB.transactions];
  if(txFilter.search){
    const q = txFilter.search.toLowerCase();
    list = list.filter(t=>{
      const cat = DB.categories.find(c=>c.id===t.category_id);
      return (t.description||'').toLowerCase().includes(q) || (cat?.name||'').toLowerCase().includes(q);
    });
  }
  if(txFilter.type) list = list.filter(t=>t.type===txFilter.type);
  const sort = txFilter.sort || 'sort_date_desc';
  list.sort((a,b)=>{
    if(sort==='sort_date_asc') return a.transaction_date.localeCompare(b.transaction_date);
    if(sort==='sort_amount_desc') return Number(b.amount)-Number(a.amount);
    if(sort==='sort_amount_asc') return Number(a.amount)-Number(b.amount);
    return b.transaction_date.localeCompare(a.transaction_date);
  });
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total/TX_PER));
  if(txPage>pages) txPage = pages;
  const slice = list.slice((txPage-1)*TX_PER, txPage*TX_PER);
  const box = document.getElementById('txList');
  if(slice.length===0){
    box.innerHTML = `<div class="text-center py-12 muted"><div class="text-3xl mb-2">🔍</div><div class="text-sm">Tidak ada transaksi</div></div>`;
  } else {
    box.innerHTML = slice.map(t => {
      const row = txRow(t);
      return `<div class="flex items-center">${row.replace('</div></div></div>', `
        <div class="flex flex-col gap-1 flex-shrink-0">
          <button onclick="openTransactionForm('${t.id}')" class="p-1.5 text-xs">✏️</button>
          <button onclick="deleteTx('${t.id}')" class="p-1.5 text-xs">🗑️</button>
        </div></div></div></div>`);
    }).join('');
  }
  document.getElementById('txPager').innerHTML = `
    <div class="text-xs">${total} transaksi</div>
    <div class="flex gap-1">
      <button ${txPage<=1?'disabled':''} onclick="txPage--;renderTxList()" class="px-3 py-1 rounded border border-divider disabled:opacity-40">‹</button>
      <span class="px-2 py-1 text-xs">${txPage}/${pages}</span>
      <button ${txPage>=pages?'disabled':''} onclick="txPage++;renderTxList()" class="px-3 py-1 rounded border border-divider disabled:opacity-40">›</button>
    </div>`;
}

      if(a){ a.name = fd.get('name'); a.type = fd.get('type'); a.color = fd.get('color'); }
      else { 
        const ob = Number(fd.get('balance')||0);
        DB.accounts.push({ id:uid('a'), name: fd.get('name'), type: fd.get('type'), color: fd.get('color'), opening_balance: ob, balance: ob }); 
      }
      recomputeBalances(DB); saveDB(DB); closeModal(); toast('Tersimpan','success'); renderAccounts();
    });
  }});
}

async function deleteAccount(id){
  if(DB.transactions.some(t=>t.account_id===id)){ toast('Masih dipakai transaksi','error'); return; }
  if(!await confirmDialog('Hapus rekening?','Rekening akan dihapus.')) return;
  DB.accounts = DB.accounts.filter(a=>a.id!==id); saveDB(DB); toast('Dihapus','success'); renderAccounts();
}

async function resetAll(){
  if(!await confirmDialog('Reset semua data?','Semua transaksi akan dihapus permanen.')) return;
  window.DB = defaultDB();
  window.DB.user.name = getSession()?.username || 'User';
  await saveDBNow(window.DB);
  toast('Data direset','success');
  route();
}

/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
function exportCSV(){
  const list = [...DB.transactions].sort((a,b)=>a.transaction_date.localeCompare(b.transaction_date));
  const header = ['tanggal','jenis','kategori','nominal','deskripsi'];
  const rows = list.map(t=>{
    const cat = DB.categories.find(c=>c.id===t.category_id);
    return [t.transaction_date, t.type, cat?.name||'', t.amount, (t.description||'').replace(/"/g,'""')]
      .map(v=>`"${v}"`).join(',');
  });
  downloadFile([header.join(','), ...rows].join('\n'), `dompetku_${todayISO()}.csv`, 'text/csv');
  toast('CSV diekspor','success');
}

function exportJSON(){
  downloadFile(JSON.stringify(DB,null,2), `dompetku_backup_${todayISO()}.json`, 'application/json');
  toast('Backup diekspor','success');
}

function downloadFile(content, name, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
}

function importFile(){
  const f = document.getElementById('impFile').files[0];
  if(!f){ toast('Pilih file','error'); return; }
  const reader = new FileReader();
  reader.onload = async e=>{
    try {
      if(f.name.endsWith('.json')){
        const data = JSON.parse(e.target.result);
        if(confirm('Timpa data saat ini dengan file backup?')){
          window.DB = data;
          recomputeBalances(DB);
          await saveDBNow(DB);
          toast('Data diimpor','success');
          route();
        }
      } else {
        toast('Gunakan file JSON untuk import lengkap','warn');
      }
    } catch(err) {
      toast('File tidak valid','error');
    }
  };
  reader.readAsText(f);
}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */
function checkNotifications(){
  if(!DB.settings.notifications) return;
  const cm = monthISO();
  const notes = [];
  DB.budgets.filter(b=>b.month===cm).forEach(b=>{
    const spent = DB.transactions.filter(t=>t.transaction_date.startsWith(cm) && t.type==='expense' && t.category_id===b.category_id && t.status==='done')
      .reduce((s,t)=>s+Number(t.amount),0);
    const pct = b.amount>0? spent/b.amount*100 : 0;
    const cat = DB.categories.find(c=>c.id===b.category_id);
    if(pct>=100) notes.push({ type:'error', title:'Budget terlewati', message:`${cat?.name}: ${fmt(spent-b.amount)} over` });
    else if(pct>=85) notes.push({ type:'warn', title:'Budget hampir habis', message:`${cat?.name}: ${pct.toFixed(0)}%` });
  });
  const badge = document.getElementById('notifBadge');
  if(notes.length>0){ badge.classList.remove('hidden'); badge.textContent = notes.length; }
  else badge.classList.add('hidden');
  window._notes = notes;
}

document.getElementById('btnNotif').addEventListener('click', ()=>{
  const notes = window._notes||[];
  openModal(`
    <h3 class="text-lg font-bold mb-4">🔔 Notifikasi</h3>
    ${notes.length===0? '<div class="muted text-sm text-center py-6">Tidak ada notifikasi</div>':
      notes.map(n=>`<div class="p-3 rounded-lg border border-divider mb-2 text-sm">
        <div class="font-semibold">${esc(n.title)}</div>
        <div class="muted text-xs">${esc(n.message)}</div>
      </div>`).join('')}
  `);
});

/* =========================================================
   THEME
   ========================================================= */
function applyTheme(){
  const t = DB.settings.theme;
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', t==='dark' || (t==='system' && sysDark));
  document.getElementById('themeSel').value = t;
  const color = document.documentElement.classList.contains('dark') ? '#0b1220' : '#3b82f6';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
}
document.getElementById('themeSel').addEventListener('change', e=>{
  DB.settings.theme = e.target.value; saveDB(DB); applyTheme(); route();
});

/* =========================================================
   PWA INSTALL
   ========================================================= */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(()=>{
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    });
  } else {
    toast('Gunakan menu browser untuk install','info');
  }
}
function dismissInstall(){
  document.getElementById('installBanner').classList.remove('show');
}

window.addEventListener('appinstalled', ()=>{
  toast('DompetKu berhasil dipasang!','success');
  document.getElementById('installBanner').classList.remove('show');
});

/* =========================================================
   INIT
   ========================================================= */
// Register Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// Check session
const session = getSession();
if(session && session.userId){
  // Try to load encrypted data
  const encData = localStorage.getItem(`dompetku_data_${session.userId}`);
  if(encData){
    decryptData(JSON.parse(encData), session._pk).then(data=>{
      if(data){
        window.DB = data;
        showApp();
      } else {
        // Password mismatch, need re-login
        clearSession();
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('loginScreen').classList.add('flex');
      }
    });
  } else {
    window.DB = defaultDB();
    showApp();
  }
} else {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginScreen').classList.add('flex');
}
</script>
