<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#3b82f6"/>
<title>DompetKu — Cloud Sync</title>
<link rel="manifest" href="./manifest.json"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#f8fafc; --card:#ffffff; --border:#e5e7eb; --text:#0f172a; --muted:#64748b; }
  .dark { --bg:#0b1220; --card:#111a2e; --border:#1f2a44; --text:#e2e8f0; --muted:#94a3b8; }
  body { background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, sans-serif; }
  .card { background:var(--card); border:1px solid var(--border); }
  .muted { color:var(--muted); }
  .chip { display:inline-flex; padding:.125rem .5rem; border-radius:9999px; font-size:.7rem; font-weight:600 }
  .chip-inc { background:#d1fae5; color:#065f46 }
  .chip-exp { background:#fee2e2; color:#991b1b }
  .chip-sav { background:#e0e7ff; color:#3730a3 }
  input,select { background:var(--card); color:var(--text); border:1px solid var(--border); font-size:16px; }
  input:focus,select:focus { outline:none; border-color:#3b82f6; }
  .modal-bg { background:rgba(0,0,0,.5); }
  .progress { height:.5rem; background:#e2e8f0; border-radius:9999px; overflow:hidden; }
  .progress > div { height:100%; }
  .fade-in { animation: fade .2s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .nav-item.active { background:rgba(59,130,246,.12); color:#2563eb; font-weight:600; }
  .dark .nav-item.active { background:rgba(96,165,250,.15); color:#93c5fd; }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-600 to-indigo-700">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-6">
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-3xl font-bold mb-3">D</div>
      <h1 class="text-2xl font-bold">DompetKu</h1>
      <p class="text-sm muted mt-1">Keuangan Pribadi • Cloud Sync</p>
    </div>
    <div class="flex gap-2 mb-4 border-b">
      <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 pb-2 font-semibold text-blue-600 border-b-2 border-blue-600">Masuk</button>
      <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 pb-2 font-semibold muted">Daftar</button>
    </div>
    <form id="loginForm" class="space-y-3">
      <input id="loginEmail" type="email" placeholder="Email" required class="w-full rounded-lg px-3 py-2"/>
      <input id="loginPass" type="password" placeholder="Password" required class="w-full rounded-lg px-3 py-2"/>
      <div id="loginError" class="hidden text-red-500 text-sm bg-red-50 p-2 rounded"></div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Masuk</button>
    </form>
    <form id="registerForm" class="hidden space-y-3">
      <input id="regName" type="text" placeholder="Nama" required class="w-full rounded-lg px-3 py-2"/>
      <input id="regEmail" type="email" placeholder="Email" required class="w-full rounded-lg px-3 py-2"/>
      <input id="regPass" type="password" placeholder="Password (min 6 karakter)" minlength="6" required class="w-full rounded-lg px-3 py-2"/>
      <div id="regError" class="hidden text-red-500 text-sm bg-red-50 p-2 rounded"></div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Daftar</button>
    </form>
    <div class="mt-4 text-center text-xs muted">☁️ Data tersinkron otomatis di cloud</div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="appScreen" class="hidden min-h-screen">
  <div class="flex min-h-screen">
    
    <!-- SIDEBAR (Desktop Only) -->
    <aside class="hidden md:flex flex-col w-64 card border-r border-divider p-4 sticky top-0 h-screen">
      <div class="flex items-center gap-2 mb-6">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold">D</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold">DompetKu</div>
          <div class="text-xs muted truncate" id="sidebarUser">User</div>
        </div>
      </div>
      <nav class="flex-1 space-y-1 text-sm">
        <a href="#/" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5" data-route="">
          <span>📊</span><span>Dashboard</span>
        </a>
        <a href="#/transactions" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5" data-route="transactions">
          <span>💳</span><span>Transaksi</span>
        </a>
        <a href="#/savings" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5" data-route="savings">
          <span>🏦</span><span>Tabungan</span>
        </a>
        <a href="#/settings" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5" data-route="settings">
          <span>⚙️</span><span>Pengaturan</span>
        </a>
      </nav>
      <div class="mt-4 pt-4 border-t border-divider">
        <div class="flex items-center gap-2 mb-3">
          <div id="syncStatus" class="text-xs muted flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Syncing...
          </div>
        </div>
        <button onclick="logout()" class="w-full bg-red-50 dark:bg-red-900/20 text-red-600 py-2 rounded-lg text-sm font-semibold"> Keluar</button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- TOPBAR -->
      <header class="card border-b px-4 py-3 flex items-center gap-3 sticky top-0 z-20">
        <div class="flex-1">
          <div class="font-bold md:hidden">DompetKu</div>
          <div class="text-xs muted md:hidden" id="headerUserMobile">User</div>
        </div>
        <button onclick="window.openTransactionForm()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
          <span>＋</span> <span class="hidden sm:inline">Transaksi</span>
        </button>
      </header>

      <main id="content" class="p-4 md:p-6 flex-1 fade-in"></main>
    </div>
  </div>

  <!-- Bottom Nav (Mobile Only) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 card border-t flex justify-around items-center z-20 pb-4 bg-white dark:bg-slate-900">
    <a href="#/" class="bnav flex-1 flex flex-col items-center py-2 text-xs" data-route="">
      <span class="text-xl">📊</span><span>Home</span>
    </a>
    <a href="#/transactions" class="bnav flex-1 flex flex-col items-center py-2 text-xs" data-route="transactions">
      <span class="text-xl">💳</span><span>Transaksi</span>
    </a>
    <a href="#/savings" class="bnav flex-1 flex flex-col items-center py-2 text-xs" data-route="savings">
      <span class="text-xl">🏦</span><span>Tabungan</span>
    </a>
    <a href="#/settings" class="bnav flex-1 flex flex-col items-center py-2 text-xs" data-route="settings">
      <span class="text-xl">⚙️</span><span>Lainnya</span>
    </a>
  </nav>

  <!-- FAB (Mobile Only) -->
  <button onclick="window.openTransactionForm()" class="md:hidden fixed right-4 bottom-20 w-14 h-14 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white text-2xl shadow-lg z-30 flex items-center justify-center">＋</button>
</div>

<div id="modalRoot"></div>
<div id="toast" class="fixed bottom-24 md:bottom-4 right-4 z-50 space-y-2 max-w-sm"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBc6A6HGByWxul33BF6kBe5vyHOY8xg53A",
  authDomain: "dompetku-c573c.firebaseapp.com",
  projectId: "dompetku-c573c",
  storageBucket: "dompetku-c573c.firebasestorage.app",
  messagingSenderId: "1008510070979",
  appId: "1:1008510070979:web:5567ae7426e3aae6a87276"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    window.currentUser = user;
    document.getElementById('headerUserMobile').textContent = user.displayName || user.email;
    document.getElementById('sidebarUser').textContent = user.displayName || user.email;
    await loadUserData(user.uid);
    showApp();
  } else {
    window.currentUser = null;
    window.DB = null;
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  }
});

async function loadUserData(uid) {
  const userDoc = doc(db, 'users', uid);
  const snapshot = await getDoc(userDoc);
  if (snapshot.exists()) {
    window.DB = snapshot.data().data;
  } else {
    window.DB = defaultDB();
    await saveUserData(uid);
  }
  onSnapshot(userDoc, (docSnap) => {
    if (docSnap.exists()) {
      const newData = docSnap.data().data;
      if (JSON.stringify(newData) !== JSON.stringify(window.DB)) {
        window.DB = newData;
        if (location.hash) window.route();
        updateSyncStatus('Synced', 'bg-emerald-500');
      }
    }
  });
}

async function saveUserData(uid) {
  updateSyncStatus('Saving...', 'bg-amber-500');
  try {
    await setDoc(doc(db, 'users', uid), { data: window.DB, updatedAt: serverTimestamp() });
    updateSyncStatus('Synced', 'bg-emerald-500');
  } catch (err) {
    console.error('Save error:', err);
    updateSyncStatus('Error', 'bg-red-500');
    window.toast('Gagal menyimpan ke cloud', 'error');
  }
}

function updateSyncStatus(text, colorClass) {
  const el = document.getElementById('syncStatus');
  if (el) el.innerHTML = `<span class="w-2 h-2 rounded-full ${colorClass}"></span> ${text}`;
}
window.saveDB = saveUserData;

window.switchAuthTab = function(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
  document.getElementById('tabLogin').classList.toggle('text-blue-600', isLogin);
  document.getElementById('tabLogin').classList.toggle('border-b-2', isLogin);
  document.getElementById('tabLogin').classList.toggle('border-blue-600', isLogin);
  document.getElementById('tabLogin').classList.toggle('muted', !isLogin);
  document.getElementById('tabRegister').classList.toggle('text-blue-600', !isLogin);
  document.getElementById('tabRegister').classList.toggle('border-b-2', !isLogin);
  document.getElementById('tabRegister').classList.toggle('border-blue-600', !isLogin);
  document.getElementById('tabRegister').classList.toggle('muted', isLogin);
  document.getElementById('loginError').classList.add('hidden');
  document.getElementById('regError').classList.add('hidden');
};

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  try { await signInWithEmailAndPassword(auth, email, password); } 
  catch (err) { errEl.textContent = translateAuthError(err.code); errEl.classList.remove('hidden'); }
});

document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPass').value;
  const errEl = document.getElementById('regError');
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });
    window.toast('Akun berhasil dibuat!', 'success');
  } catch (err) { errEl.textContent = translateAuthError(err.code); errEl.classList.remove('hidden'); }
});

function translateAuthError(code) {
  const errors = { 'auth/user-not-found': 'Email tidak terdaftar', 'auth/wrong-password': 'Password salah', 'auth/invalid-email': 'Format email tidak valid', 'auth/email-already-in-use': 'Email sudah dipakai', 'auth/weak-password': 'Password minimal 6 karakter', 'auth/invalid-credential': 'Email atau password salah' };
  return errors[code] || 'Terjadi kesalahan: ' + code;
}

window.logout = async function() { if (!confirm('Keluar dari aplikasi?')) return; await signOut(auth); };
window.showApp = function() { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appScreen').classList.remove('hidden'); if (!location.hash) location.hash = '#/'; window.route(); };

function defaultDB() {
  return {
    user: { name: 'User', currency: 'Rp' },
    accounts: [ { id:'a1', name:'Cash', type:'cash', opening_balance:0, balance:0, color:'#10b981' }, { id:'a2', name:'Bank BCA', type:'bank', opening_balance:0, balance:0, color:'#3b82f6' }, { id:'a3', name:'GoPay', type:'ewallet', opening_balance:0, balance:0, color:'#0ea5e9' } ],
    categories: [ { id:'c1', name:'Gaji', type:'income', color:'#10b981', icon:'💼' }, { id:'c2', name:'Bonus', type:'income', color:'#22c55e', icon:'' }, { id:'c3', name:'Freelance', type:'income', color:'#14b8a6', icon:'💻' }, { id:'c10', name:'Makanan', type:'expense', color:'#ef4444', icon:'🍔' }, { id:'c11', name:'Transportasi', type:'expense', color:'#f97316', icon:'🚗' }, { id:'c12', name:'Belanja', type:'expense', color:'#eab308', icon:'🛍️' }, { id:'c13', name:'Tagihan', type:'expense', color:'#a855f7', icon:'📄' }, { id:'c16', name:'Hiburan', type:'expense', color:'#ec4899', icon:'🎬' }, { id:'c22', name:'Lainnya', type:'expense', color:'#78716c', icon:'📦' }, { id:'c30', name:'Dana Darurat', type:'saving', color:'#6366f1', icon:'🛟' }, { id:'c32', name:'Tabungan Liburan', type:'saving', color:'#06b6d4', icon:'🏖️' }, { id:'c33', name:'Tabungan Lainnya', type:'saving', color:'#10b981', icon:'🏦' } ],
    transactions: [], savings_goals: [], transfers: [], settings: { theme: 'light' }
  };
}

function uid(p) { return p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
const fmt = n => { const v = Number(n||0); return (window.DB.user.currency||'Rp') + ((v<0?'-':'') + Math.abs(v).toLocaleString('id-ID',{maximumFractionDigits:0})); };
const dateISO = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayISO = () => dateISO(new Date());
const monthISO = (d) => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.toast = function(msg, type) {
  type = type || 'info';
  const colors = { info:'bg-blue-600', success:'bg-emerald-600', error:'bg-red-600', warn:'bg-amber-600' };
  const el = document.createElement('div');
  el.className = colors[type] + ' text-white px-4 py-2 rounded-lg shadow-lg text-sm fade-in';
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(() => el.remove(), 300); }, 2800);
};

window.confirmDialog = function(title, message) {
  return new Promise(resolve => {
    window.openModal('<h3 class="text-lg font-bold mb-2">' + esc(title) + '</h3><p class="muted text-sm mb-4">' + esc(message) + '</p><div class="flex justify-end gap-2"><button class="px-4 py-2 rounded-lg border" data-close>Batal</button><button class="px-4 py-2 rounded-lg bg-red-600 text-white" id="confirmYes">Ya</button></div>', { 
      onMount: root => { root.querySelector('#confirmYes').onclick = () => { window.closeModal(); resolve(true); }; }, onClose: () => resolve(false)
    });
  });
};

window.openModal = function(html, opts) {
  opts = opts || {};
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="fixed inset-0 z-40 modal-bg flex items-end md:items-center justify-center p-0 md:p-4"><div class="card rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-lg max-h-[90vh] overflow-auto fade-in p-6">' + html + '</div></div>';
  const box = root.querySelector('.card');
  box.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { window.closeModal(); if(opts.onClose) opts.onClose(); });
  root.addEventListener('click', e => { if(e.target === root.firstElementChild) { window.closeModal(); if(opts.onClose) opts.onClose(); } }, { once:true });
  if(opts.onMount) opts.onMount(box);
};
window.closeModal = function() { document.getElementById('modalRoot').innerHTML = ''; };

function recomputeBalances(db) {
  db.accounts.forEach(a => a.balance = Number(a.opening_balance||0));
  db.transactions.filter(t => t.status === 'done').forEach(t => {
    const acc = db.accounts.find(a => a.id === t.account_id);
    if(!acc) return;
    if(t.type === 'income') acc.balance += Number(t.amount);
    else if(t.type === 'expense') acc.balance -= Number(t.amount);
  });
}
function getTotalAllocated(db) { return db.savings_goals.reduce((s,g) => s + Number(g.current||0), 0); }
function getAvailableBalance(db) { return Math.max(0, window.DB.accounts.reduce((s,a) => s + Number(a.balance||0), 0) - getTotalAllocated(window.DB)); }

const routes = { '': { title:'Dashboard', render: renderDashboard }, 'transactions': { title:'Transaksi', render: renderTransactions }, 'savings': { title:'Tabungan', render: renderSavings }, 'settings': { title:'Pengaturan', render: renderSettings } };

window.route = function() {
  const hash = (location.hash || '#/').slice(2);
  const r = routes[hash] || routes[''];
  document.querySelectorAll('.nav-item, .bnav').forEach(el => {
    const isActive = el.dataset.route === hash;
    el.classList.toggle('active', isActive);
    el.classList.toggle('text-blue-600', isActive);
    el.classList.toggle('muted', !isActive);
  });
  const c = document.getElementById('content');
  c.classList.remove('fade-in'); void c.offsetWidth; c.classList.add('fade-in');
  r.render();
  window.scrollTo(0,0);
};
window.addEventListener('hashchange', window.route);

function renderDashboard() {
  const isMobile = window.innerWidth < 768;
  const cm = monthISO();
  const txs = window.DB.transactions.filter(t => t.transaction_date.startsWith(cm) && t.status === 'done');
  const income = txs.filter(t => t.type === 'income').reduce((s,t) => s + Number(t.amount), 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s,t) => s + Number(t.amount), 0);
  const saving = txs.filter(t => t.type === 'saving').reduce((s,t) => s + Number(t.amount), 0);
  const totalBalance = window.DB.accounts.reduce((s,a) => s + Number(a.balance||0), 0);
  const totalAllocated = getTotalAllocated(window.DB);
  const availableBalance = getAvailableBalance(window.DB);

  let html = '<div class="mb-4"><h1 class="text-2xl font-bold">Dashboard</h1><p class="muted text-sm">' + new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric'}) + '</p></div>';
  html += '<div class="card rounded-2xl p-4 mb-4 bg-gradient-to-br from-blue-600 to-indigo-700 text-white"><div class="text-xs opacity-80 mb-1"> Saldo Total</div><div class="text-3xl font-bold mb-3">' + fmt(totalBalance) + '</div><div class="grid grid-cols-2 gap-2"><div class="bg-white/10 rounded-lg p-2"><div class="text-xs opacity-80">🏦 Dialokasikan</div><div class="text-sm font-bold">' + fmt(totalAllocated) + '</div></div><div class="bg-white/10 rounded-lg p-2"><div class="text-xs opacity-80">✅ Siap Pakai</div><div class="text-sm font-bold">' + fmt(availableBalance) + '</div></div></div></div>';

  if (isMobile) {
    html += '<div class="grid grid-cols-2 gap-2 mb-4"><div class="card rounded-xl p-3"><div class="text-xs muted">📥 Pemasukan</div><div class="text-lg font-bold text-emerald-600">' + fmt(income) + '</div></div><div class="card rounded-xl p-3"><div class="text-xs muted">📤 Pengeluaran</div><div class="text-lg font-bold text-red-600">' + fmt(expense) + '</div></div></div>';
    html += '<div class="grid grid-cols-2 gap-2 mb-4"><button onclick="window.openTransactionForm()" class="card rounded-xl p-4 text-center hover:bg-black/5"><div class="text-2xl mb-1"></div><div class="text-sm font-semibold">Catat Transaksi</div></button><a href="#/transactions" class="card rounded-xl p-4 text-center hover:bg-black/5"><div class="text-2xl mb-1">📋</div><div class="text-sm font-semibold">Lihat Semua</div></a></div>';
  } else {
    html += '<div class="grid grid-cols-4 gap-3 mb-4"><div class="card rounded-xl p-3"><div class="text-xs muted">📥 Pemasukan</div><div class="text-lg font-bold text-emerald-600">' + fmt(income) + '</div></div><div class="card rounded-xl p-3"><div class="text-xs muted">📤 Pengeluaran</div><div class="text-lg font-bold text-red-600">' + fmt(expense) + '</div></div><div class="card rounded-xl p-3"><div class="text-xs muted">🏦 Tabungan</div><div class="text-lg font-bold text-indigo-600">' + fmt(saving) + '</div></div><div class="card rounded-xl p-3"><div class="text-xs muted">💳 Transaksi</div><div class="text-lg font-bold">' + txs.length + '</div></div></div>';
  }
  html += '<div class="card rounded-2xl p-4"><div class="flex items-center justify-between mb-3"><h3 class="font-semibold">Transaksi Terbaru</h3><a href="#/transactions" class="text-blue-600 text-sm">Lihat →</a></div>' + renderRecentTx() + '</div>';
  document.getElementById('content').innerHTML = html;
}

function renderRecentTx() {
  const recent = window.DB.transactions.slice().sort((a,b) => b.transaction_date.localeCompare(a.transaction_date)).slice(0,5);
  if(recent.length === 0) return '<div class="text-center py-6 muted text-sm">Belum ada transaksi</div>';
  return recent.map(t => {
    const cat = window.DB.categories.find(c => c.id === t.category_id);
    const chip = t.type === 'income' ? 'chip-inc' : t.type === 'expense' ? 'chip-exp' : 'chip-sav';
    const color = t.type === 'income' ? 'text-emerald-600' : t.type === 'expense' ? 'text-red-600' : 'text-indigo-600';
    const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '';
    return '<div class="flex items-center gap-2 p-2 border-b last:border-0"><div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background:' + (cat?.color||'#888') + '22">' + (cat?.icon||'💸') + '</div><div class="flex-1 min-w-0"><div class="font-medium text-sm truncate">' + esc(t.description||cat?.name||'-') + '</div><div class="text-xs muted">' + fmtDate(t.transaction_date) + ' • <span class="chip ' + chip + '">' + (cat?.name||'-') + '</span></div></div><div class="font-bold text-sm ' + color + '">' + sign + fmt(t.amount) + '</div></div>';
  }).join('');
}

let txFilter = { search:'', type:'' };
function renderTransactions() {
  document.getElementById('content').innerHTML = '<div class="mb-4"><h1 class="text-2xl font-bold">Transaksi</h1><p class="muted text-sm">Semua transaksi Anda</p></div><div class="card rounded-xl p-3 mb-4 space-y-2"><input id="fSearch" placeholder="🔍 Cari..." class="w-full rounded-lg px-3 py-2 text-sm" value="' + esc(txFilter.search) + '"/><select id="fType" class="w-full rounded-lg px-3 py-2 text-sm"><option value="">Semua jenis</option><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option><option value="saving">Tabungan</option></select></div><div class="card rounded-xl overflow-hidden"><div id="txList"></div></div>';
  document.getElementById('fSearch').addEventListener('input', e => { txFilter.search = e.target.value; renderTxList(); });
  document.getElementById('fType').addEventListener('change', e => { txFilter.type = e.target.value; renderTxList(); });
  renderTxList();
}

function renderTxList() {
  let list = window.DB.transactions.slice();
  if(txFilter.search) list = list.filter(t => (t.description||'').toLowerCase().includes(txFilter.search.toLowerCase()));
  if(txFilter.type) list = list.filter(t => t.type === txFilter.type);
  list.sort((a,b) => b.transaction_date.localeCompare(a.transaction_date));
  const box = document.getElementById('txList');
  if(list.length === 0) { box.innerHTML = '<div class="text-center py-12 muted text-sm">Tidak ada transaksi</div>'; return; }
  box.innerHTML = list.map(t => {
    const cat = window.DB.categories.find(c => c.id === t.category_id);
    const chip = t.type === 'income' ? 'chip-inc' : t.type === 'expense' ? 'chip-exp' : 'chip-sav';
    const color = t.type === 'income' ? 'text-emerald-600' : t.type === 'expense' ? 'text-red-600' : 'text-indigo-600';
    const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '';
    return '<div class="flex items-center gap-2 p-3 border-b last:border-0"><div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0" style="background:' + (cat?.color||'#888') + '22">' + (cat?.icon||'💸') + '</div><div class="flex-1 min-w-0"><div class="font-medium text-sm truncate">' + esc(t.description||cat?.name||'-') + '</div><div class="text-xs muted">' + fmtDate(t.transaction_date) + ' • <span class="chip ' + chip + '">' + (cat?.name||'-') + '</span></div></div><div class="text-right flex-shrink-0"><div class="font-bold text-sm ' + color + '">' + sign + fmt(t.amount) + '</div><div class="flex gap-1 justify-end mt-1"><button onclick="window.openTransactionForm(\'' + t.id + '\')" class="text-xs p-1">✏️</button><button onclick="window.deleteTx(\'' + t.id + '\')" class="text-xs p-1">️</button></div></div></div>';
  }).join('');
}

window.deleteTx = async function(id) {
  if(!await window.confirmDialog('Hapus transaksi?','Data tidak bisa dikembalikan.')) return;
  window.DB.transactions = window.DB.transactions.filter(t => t.id !== id);
  recomputeBalances(window.DB);
  await window.saveDB(window.currentUser.uid);
  window.toast('Dihapus','success');
  window.route();
};

window.openTransactionForm = function(id) {
  const t = id ? window.DB.transactions.find(x => x.id === id) : null;
  const isEdit = !!t;
  const html = '<h3 class="text-lg font-bold mb-4">' + (isEdit ? 'Edit' : 'Tambah') + ' Transaksi</h3><form id="txForm" class="space-y-3"><div class="grid grid-cols-3 gap-2"><label class="cursor-pointer"><input type="radio" name="type" value="income" class="hidden peer" ' + ((t?.type==='income')?'checked':'') + '/><div class="peer-checked:ring-2 peer-checked:ring-blue-500 p-2 rounded-lg border text-center text-xs">📥 Masuk</div></label><label class="cursor-pointer"><input type="radio" name="type" value="expense" class="hidden peer" ' + ((!isEdit)||(t?.type==='expense')?'checked':'') + '/><div class="peer-checked:ring-2 peer-checked:ring-blue-500 p-2 rounded-lg border text-center text-xs">📤 Keluar</div></label><label class="cursor-pointer"><input type="radio" name="type" value="saving" class="hidden peer" ' + ((t?.type==='saving')?'checked':'') + '/><div class="peer-checked:ring-2 peer-checked:ring-blue-500 p-2 rounded-lg border text-center text-xs">🏦 Tabung</div></label></div><div><label class="text-xs muted">Nominal</label><input name="amount" type="number" min="1" required class="w-full rounded-lg px-3 py-2" value="' + (t?.amount||'') + '" placeholder="0"/></div><div class="grid grid-cols-2 gap-2"><div><label class="text-xs muted">Tanggal</label><input name="date" type="date" required class="w-full rounded-lg px-3 py-2" value="' + (t?.transaction_date||todayISO()) + '"/></div><div><label class="text-xs muted">Rekening</label><select name="account_id" class="w-full rounded-lg px-3 py-2">' + window.DB.accounts.map(a => '<option value="' + a.id + '" ' + (t?.account_id===a.id?'selected':'') + '>' + esc(a.name) + '</option>').join('') + '</select></div></div><div><label class="text-xs muted">Kategori</label><select name="category_id" id="catSel" class="w-full rounded-lg px-3 py-2"></select></div><div><label class="text-xs muted">Deskripsi</label><input name="description" class="w-full rounded-lg px-3 py-2" value="' + esc(t?.description||'') + '" placeholder="Contoh: Makan siang"/></div><div class="flex justify-end gap-2"><button type="button" class="px-4 py-2 rounded-lg border" data-close>Batal</button><button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">Simpan</button></div></form>';
  
  window.openModal(html, { onMount: root => {
    const form = root.querySelector('#txForm');
    const catSel = root.querySelector('#catSel');
    const refreshCats = () => {
      const type = form.querySelector('input[name=type]:checked').value;
      const cats = window.DB.categories.filter(c => c.type === type);
      catSel.innerHTML = cats.map(c => '<option value="' + c.id + '" ' + (t?.category_id===c.id?'selected':'') + '>' + c.icon + ' ' + esc(c.name) + '</option>').join('');
    };
    refreshCats();
    form.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', refreshCats));
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const amount = Number(fd.get('amount'));
      if(!amount || amount <= 0) { window.toast('Nominal harus > 0','error'); return; }
      const data = { account_id: fd.get('account_id'), category_id: fd.get('category_id'), type: fd.get('type'), amount, transaction_date: fd.get('date'), description: fd.get('description')||'', status: 'done' };
      if(isEdit) Object.assign(t, data);
      else window.DB.transactions.push({ id: uid('t'), ...data });
      recomputeBalances(window.DB);
      await window.saveDB(window.currentUser.uid);
      window.closeModal(); window.toast(isEdit ? 'Diperbarui' : 'Ditambahkan','success');
      window.route();
    });
  }});
};

function renderSavings() {
  const goals = window.DB.savings_goals;
  const totalBalance = window.DB.accounts.reduce((s,a) => s + Number(a.balance||0), 0);
  const totalAllocated = getTotalAllocated(window.DB);
  let html = '<div class="mb-4"><h1 class="text-2xl font-bold">Target Tabungan</h1><p class="muted text-sm">Alokasi virtual dari saldo Anda</p></div><div class="card rounded-xl p-4 mb-4 bg-gradient-to-br from-indigo-50 to-purple-50 dark:from-indigo-900/20 dark:to-purple-900/20"><div class="grid grid-cols-2 gap-2 text-center"><div><div class="text-xs muted">Saldo Fisik</div><div class="text-lg font-bold text-blue-600">' + fmt(totalBalance) + '</div></div><div><div class="text-xs muted">Dialokasikan</div><div class="text-lg font-bold text-purple-600">' + fmt(totalAllocated) + '</div></div></div></div><button onclick="window.openGoalForm()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold mb-4">＋ Target Baru</button><div class="space-y-3">';
  if(goals.length === 0) html += '<div class="card rounded-xl p-8 text-center muted text-sm">Belum ada target tabungan</div>';
  goals.forEach(g => {
    const pct = g.target > 0 ? (g.current/g.target*100) : 0;
    const days = daysBetween(todayISO(), g.deadline);
    const monthly = days > 0 ? Math.ceil((g.target-g.current)/(days/30)) : 0;
    const color = pct >= 100 ? 'bg-emerald-500' : pct >= 60 ? 'bg-indigo-500' : 'bg-amber-500';
    html += '<div class="card rounded-xl p-4"><div class="flex items-start justify-between mb-2"><div class="flex-1 min-w-0"><div class="font-bold truncate">' + esc(g.name) + '</div><div class="text-xs muted">Target: ' + fmt(g.target) + '</div></div><div class="flex gap-1"><button onclick="window.addSaving(\'' + g.id + '\')" class="p-2">💵</button><button onclick="window.openGoalForm(\'' + g.id + '\')" class="p-2">✏️</button><button onclick="window.deleteGoal(\'' + g.id + '\')" class="p-2">️</button></div></div><div class="flex items-baseline gap-1 mb-2"><div class="text-xl font-bold">' + fmt(g.current) + '</div><div class="text-xs muted">/ ' + fmt(g.target) + '</div></div><div class="progress mb-2"><div class="' + color + '" style="width:' + Math.min(100,pct) + '%"></div></div><div class="flex justify-between text-xs muted"><span>' + pct.toFixed(1) + '% progress</span><span>' + (days > 0 ? days + ' hari lagi' : 'Terlewat') + '</span></div>';
    if(days > 0) html += '<div class="text-xs mt-2 p-2 rounded bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400"><b>~' + fmt(monthly) + '/bulan</b> untuk mencapai target</div>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

window.openGoalForm = function(id) {
  const g = id ? window.DB.savings_goals.find(x => x.id === id) : null;
  const html = '<h3 class="text-lg font-bold mb-4">' + (g ? 'Edit' : 'Tambah') + ' Target</h3><form id="gForm" class="space-y-3"><div><label class="text-xs muted">Nama</label><input name="name" required class="w-full rounded-lg px-3 py-2" value="' + esc(g?.name||'') + '"/></div><div class="grid grid-cols-2 gap-2"><div><label class="text-xs muted">Target</label><input name="target" type="number" min="1" required class="w-full rounded-lg px-3 py-2" value="' + (g?.target||'') + '"/></div><div><label class="text-xs muted">Saat ini</label><input name="current" type="number" min="0" required class="w-full rounded-lg px-3 py-2" value="' + (g?.current||0) + '"/></div></div><div><label class="text-xs muted">Deadline</label><input name="deadline" type="date" required class="w-full rounded-lg px-3 py-2" value="' + (g?.deadline||'') + '"/></div><div class="flex justify-end gap-2"><button type="button" class="px-4 py-2 rounded-lg border" data-close>Batal</button><button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">Simpan</button></div></form>';
  window.openModal(html, { onMount: root => {
    root.querySelector('#gForm').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = { name: fd.get('name'), target: Number(fd.get('target')), current: Number(fd.get('current')), deadline: fd.get('deadline') };
      if(g) Object.assign(g, data); else window.DB.savings_goals.push({ id: uid('g'), ...data });
      await window.saveDB(window.currentUser.uid);
      window.closeModal(); window.toast('Tersimpan','success'); renderSavings();
    });
  }});
};

window.addSaving = function(id) {
  const html = '<h3 class="text-lg font-bold mb-2">💵 Tambah Alokasi</h3><div class="p-2 rounded-lg bg-indigo-50 dark:bg-indigo-900/20 text-xs mb-3">Saldo rekening fisik tidak berubah.</div><form id="addForm" class="space-y-3"><div><label class="text-xs muted">Nominal</label><input name="amount" type="number" min="1" required class="w-full rounded-lg px-3 py-2"/></div><div><label class="text-xs muted">Tanggal</label><input name="date" type="date" required class="w-full rounded-lg px-3 py-2" value="' + todayISO() + '"/></div><div class="flex justify-end gap-2"><button type="button" class="px-4 py-2 rounded-lg border" data-close>Batal</button><button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">Tambah</button></div></form>';
  window.openModal(html, { onMount: root => {
    root.querySelector('#addForm').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const g = window.DB.savings_goals.find(x => x.id === id);
      const amount = Number(fd.get('amount'));
      g.current += amount;
      window.DB.transactions.push({ id: uid('t'), account_id: window.DB.accounts[0].id, category_id: 'c33', type: 'saving', amount, transaction_date: fd.get('date'), description: 'Alokasi: ' + g.name, status: 'done' });
      await window.saveDB(window.currentUser.uid);
      window.closeModal(); window.toast('Ditambahkan','success'); renderSavings();
    });
  }});
};

window.deleteGoal = async function(id) {
  if(!await window.confirmDialog('Hapus target?','Target akan dihapus.')) return;
  window.DB.savings_goals = window.DB.savings_goals.filter(g => g.id !== id);
  await window.saveDB(window.currentUser.uid);
  window.toast('Dihapus','success'); renderSavings();
};

function renderSettings() {
  const user = window.currentUser;
  const html = '<div class="mb-4"><h1 class="text-2xl font-bold">Pengaturan</h1><p class="muted text-sm">Profil & data</p></div><div class="card rounded-xl p-4 mb-3"><div class="flex items-center gap-3 mb-3"><div class="w-12 h-12 rounded-full bg-gradient-to-br from-emerald-400 to-blue-500 flex items-center justify-center text-white font-bold text-lg">' + (user?.displayName||'U')[0].toUpperCase() + '</div><div><div class="font-bold">' + esc(user?.displayName||'User') + '</div><div class="text-xs muted">' + esc(user?.email||'') + '</div><div class="text-xs text-emerald-600 mt-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Tersinkron dengan cloud</div></div></div><button onclick="window.logout()" class="w-full bg-red-50 dark:bg-red-900/20 text-red-600 py-2 rounded-lg font-semibold"> Keluar</button></div><div class="card rounded-xl p-4 mb-3"><h3 class="font-semibold mb-3">📱 Install di HP</h3><div class="text-sm muted space-y-1"><div>📲 <b>Android:</b> Menu ⋮ → "Install app"</div><div>📲 <b>iPhone:</b> Share → "Add to Home Screen"</div></div></div><div class="card rounded-xl p-4 mb-3"><h3 class="font-semibold mb-3">⬇️ Backup Lokal</h3><button onclick="window.exportJSON()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm mb-2">Export JSON Backup</button><button onclick="window.exportCSV()" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm">Export CSV</button></div><div class="card rounded-xl p-4"><h3 class="font-semibold mb-3 text-red-600">⚠️ Reset Data</h3><button onclick="window.resetAll()" class="w-full bg-red-600 text-white py-2 rounded-lg text-sm">Reset Semua Data</button></div>';
  document.getElementById('content').innerHTML = html;
}

window.resetAll = async function() {
  if(!await window.confirmDialog('Reset semua data?','Semua data akan dihapus dari cloud.')) return;
  window.DB = defaultDB();
  window.DB.user.name = window.currentUser?.displayName || 'User';
  await window.saveDB(window.currentUser.uid);
  window.toast('Data direset','success');
  window.route();
};

window.exportCSV = function() {
  const list = window.DB.transactions.slice().sort((a,b) => a.transaction_date.localeCompare(b.transaction_date));
  const header = ['tanggal','jenis','kategori','nominal','deskripsi'];
  const rows = list.map(t => { const cat = window.DB.categories.find(c => c.id === t.category_id); return [t.transaction_date, t.type, cat?.name||'', t.amount, (t.description||'').replace(/"/g,'""')].map(v => '"' + v + '"').join(','); });
  downloadFile([header.join(','), ...rows].join('\n'), 'dompetku_' + todayISO() + '.csv', 'text/csv');
  window.toast('CSV diekspor','success');
};

window.exportJSON = function() {
  downloadFile(JSON.stringify(window.DB, null, 2), 'dompetku_backup_' + todayISO() + '.json', 'application/json');
  window.toast('Backup diekspor','success');
};

function downloadFile(content, name, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}
</script>
